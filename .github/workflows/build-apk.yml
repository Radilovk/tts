name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'android-res/**'
      - 'scripts/build-shell.mjs'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One APK build at a time: they all publish to the same download link
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: |
          npm ci
          pip install --quiet pillow

      - name: Signing key
        # Optional: a private key in the RZ_KEYSTORE_BASE64 secret replaces the one in android-res/
        env:
          KEYSTORE_B64: ${{ secrets.RZ_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RZ_STORE_PASS }}
          KEY_PASS: ${{ secrets.RZ_KEY_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rz.keystore"
            echo "RZ_KEYSTORE_PATH=$RUNNER_TEMP/rz.keystore" >> "$GITHUB_ENV"
            echo "RZ_STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
            echo "RZ_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          fi

      - name: Build web shell and Android project
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/build-shell.mjs
          npx cap add android
          python3 android-res/patch-android.py
          npx cap sync android

      - name: Build APK
        run: |
          V_CODE=${{ github.run_number }}
          V_NAME="1.0.${V_CODE}"
          echo "V_NAME=${V_NAME}" >> "$GITHUB_ENV"
          cd android
          ./gradlew --no-daemon assembleRelease -PrzVersionName="$V_NAME" -PrzVersionCode="$V_CODE"
          cd ..
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Razkazvach.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Razkazvach-APK
          path: release/Razkazvach.apk
          retention-days: 30

      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-latest"
          REPO="${{ github.repository }}"
          TITLE="Разказвач ${V_NAME}"
          NOTES="Най-новият APK (${{ github.ref_name }}, ${GITHUB_SHA::7}). Изтеглете Razkazvach.apk и го отворете на телефона."
          # Update the existing release in place (safe when two builds finish close together)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release/Razkazvach.apk --clobber --repo "$REPO"
            # --draft=false also publishes a release left as a draft by an interrupted run
            # (and recreates the tag at this commit if it went missing)
            gh release edit "$TAG" --repo "$REPO" --title "$TITLE" --notes "$NOTES" --prerelease --draft=false --target "${{ github.sha }}"
          else
            gh release create "$TAG" release/Razkazvach.apk --repo "$REPO" --target "${{ github.sha }}" \
              --prerelease --title "$TITLE" --notes "$NOTES" \
            || gh release upload "$TAG" release/Razkazvach.apk --clobber --repo "$REPO"
          fi
          # Fail loudly if the public download link does not work
          gh release view "$TAG" --repo "$REPO" --json isDraft,assets --jq '.isDraft, (.assets[].name)'
          test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" = "false"
          echo "### APK ${V_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${REPO}/releases/download/${TAG}/Razkazvach.apk" >> "$GITHUB_STEP_SUMMARY"
