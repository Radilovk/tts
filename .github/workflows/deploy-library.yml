name: Deploy library worker

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-library.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Добавете CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID в Settings → Secrets and variables → Actions на това репо (същите като в aidiet)."
            exit 1
          fi

      - name: Create the R2 bucket (once)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 r2 bucket list 2>/dev/null | grep -q 'razkazvach-audio'; then
            echo "R2 bucket exists"
          elif npx --yes wrangler@4 r2 bucket create razkazvach-audio; then
            echo "R2 bucket created"
          else
            echo "::warning::R2 bucket could not be created (R2 must be enabled once in the Cloudflare dashboard, and the token needs R2 edit rights). Deploying without the shared cache."
            sed -i '/\[\[r2_buckets\]\]/,$d' wrangler.toml
          fi

      - name: Deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
