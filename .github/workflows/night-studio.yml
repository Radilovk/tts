name: Night studio (whole books narrated on the server)

# Narrates the books queued from the app ("⋯ → Озвучи цялата книга на сървъра") while
# the phone is off. No secrets: the worker trusts this workflow through the OIDC token
# GitHub signs for every run, and each book carries the key that pays for it.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: night-studio
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # the OIDC token the worker checks

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Narrate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          MAX_MINUTES: '300'
        run: node scripts/night-studio.mjs
