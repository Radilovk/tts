// Applied from android/app/build.gradle by android-res/patch-android.py

def rzVersionCode = project.findProperty('rzVersionCode')
def rzVersionName = project.findProperty('rzVersionName')
def keystorePath = System.getenv('RZ_KEYSTORE_PATH')

android {
    if (rzVersionCode != null) defaultConfig.versionCode rzVersionCode.toInteger()
    if (rzVersionName != null) defaultConfig.versionName rzVersionName.toString()

    // One fixed signing key, so every new APK installs as an update over the old one
    // (library and saved audio are kept). See android-res/README.md.
    signingConfigs {
        rz {
            storeFile file(keystorePath ?: "${rootDir}/../android-res/razkazvach.keystore")
            storePassword System.getenv('RZ_STORE_PASS') ?: 'razkazvach'
            keyAlias System.getenv('RZ_KEY_ALIAS') ?: 'razkazvach'
            keyPassword System.getenv('RZ_KEY_PASS') ?: 'razkazvach'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.rz }
        release {
            signingConfig signingConfigs.rz
            minifyEnabled false
        }
    }
}

// Offline voice (Supertonic 3 through sherpa-onnx). The model itself (~130 MB) is not in
// the APK: it is downloaded once, when the listener chooses the offline voice.
repositories {
    maven { url 'https://jitpack.io' }
}

android {
    packagingOptions {
        jniLibs {
            // Phones only (no emulator builds) and only the library the Java bridge loads
            excludes += ['lib/x86/**', 'lib/x86_64/**', 'lib/*/libsherpa-onnx-c-api.so', 'lib/*/libsherpa-onnx-cxx-api.so']
        }
    }
}

dependencies {
    implementation 'androidx.media:media:1.7.0'
    implementation 'com.github.k2-fsa:sherpa-onnx:v1.13.4'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    // .tar.bz2 of the voice model
    implementation 'org.apache.commons:commons-compress:1.27.1'
}
